# Render Blueprint — https://github.com/Mukulraj109/hack-backend
# Dashboard → New → Blueprint → connect repo (or create Web Service manually with same settings)

services:
  - type: web
    name: hack-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DATABASE
        value: firststep_db
      - key: SKIP_FIREBASE
        value: "true"
      # Set these in Render Dashboard (Environment) — do not commit real values:
      - key: MONGODB_URI
        sync: false
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: ZOHO_WEBHOOK_SECRET
        sync: false
