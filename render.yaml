# Render Blueprint — https://github.com/Mukulraj109/hack-backend
# Dashboard → New → Blueprint → connect repo (or create Web Service manually with same settings)

services:
  - type: web
    name: hack-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DATABASE
        value: firststep_db
      - key: SKIP_FIREBASE
        value: "false"
      # Set these in Render Dashboard (Environment) — do not commit real values:
      - key: MONGODB_URI
        sync: false
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: ZOHO_WEBHOOK_SECRET
        sync: false
      # Zoho form URLs
      - key: ZOHO_REGISTRATION_FORM_URL
        sync: false
      - key: ZOHO_FOLLOW_FORM_URL
        sync: false
      - key: ZOHO_HIRING_PARTNER_FORM_URL
        sync: false
      - key: ZOHO_INFO_SESSION_FORM_URL
        sync: false
      - key: ZOHO_SOCIAL_SHARE_FORM_URL
        sync: false
      # Zoho social webhook — dual-platform form (LinkedIn Field_7/8, Instagram Field_9/10)
      - key: ZOHO_SOCIAL_WEBHOOK_FIELD_LINKEDIN_POST_URL
        value: "Field_7"
      - key: ZOHO_SOCIAL_WEBHOOK_FIELD_LINKEDIN_SCREENSHOT
        value: "Field_8"
      - key: ZOHO_SOCIAL_WEBHOOK_FIELD_INSTAGRAM_POST_URL
        value: "Field_9"
      - key: ZOHO_SOCIAL_WEBHOOK_FIELD_INSTAGRAM_SCREENSHOT
        value: "Field_10"
      # Firebase
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
